version: '3.8'

services:
  web:
    build: .
    container_name: site_yk_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=True
    command: python manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:15
    container_name: site_yk_db
    environment:
      - POSTGRES_DB=site_yk
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: site_yk_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: