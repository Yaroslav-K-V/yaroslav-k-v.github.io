<!-- edit_post.html — Create or edit a research post -->
{% extends "base.html" %}

{% block title %}{% if post %}Edit Post{% else %}New Post{% endif %} — Yaroslav Krupoder{% endblock %}

{% block content %}
  <section>
    <h2>{% if post %}Edit Post{% else %}New Post{% endif %}</h2>

    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label for="title">Title:</label>
      <input type="text" id="title" name="title"
             value="{{ post.title if post else '' }}" required />

      <label for="summary">Summary:</label>
      <input type="text" id="summary" name="summary"
             value="{{ post.summary if post else '' }}" required />

      <label for="content">Content:</label>
      <textarea id="content" name="content" required>{{ post.content if post else '' }}</textarea>
      <p><small>Separate paragraphs with a blank line.</small></p>

      <button type="submit">{% if post %}Save{% else %}Create{% endif %}</button>
    </form>

    <p><a href="{{ url_for('admin') }}">Back to Admin</a></p>
  </section>
{% endblock %}
