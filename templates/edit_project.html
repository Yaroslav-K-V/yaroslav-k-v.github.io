<!-- edit_project.html — Create or edit a project -->
{% extends "base.html" %}

{% block title %}{% if project %}Edit Project{% else %}New Project{% endif %} — Yaroslav Krupoder{% endblock %}

{% block content %}
  <section>
    <h2>{% if project %}Edit Project{% else %}New Project{% endif %}</h2>

    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label for="title">Title:</label>
      <input type="text" id="title" name="title"
             value="{{ project.title if project else '' }}" required />

      <label for="description">Description:</label>
      <textarea id="description" name="description" required>{{ project.description if project else '' }}</textarea>

      <label for="github_link">GitHub link:</label>
      <input type="text" id="github_link" name="github_link"
             value="{{ project.github_link if project else '' }}" />

      <button type="submit">{% if project %}Save{% else %}Create{% endif %}</button>
    </form>

    <p><a href="{{ url_for('admin') }}">Back to Admin</a></p>
  </section>
{% endblock %}
